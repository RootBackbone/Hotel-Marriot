server:
  port: ${PORT:8080}

spring:
  application:
    name: notificaciones
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_notificaciones}
    username: ${DB_USER:marriott}
    password: ${DB_PASSWORD:marriott}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Lima
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

notificaciones:
  remitente: ${MAIL_FROM:JW Marriott Hotel Lima <no-reply@marioaponte.me>}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    pe.utp.marriott: INFO
